name: MANA XZ Omega Android verification

on:
  push:
    branches: [Final]
    paths:
      - "launcher/**"
      - "engine/**"
      - "os/**"
      - "system/**"
      - "game/**"
      - "tools/validate_mana_game_pack.py"
      - "tools/validate_mana_installer_contract.py"
      - "distribution/**"
      - ".github/workflows/mana-android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "launcher/**"
      - "engine/**"
      - "os/**"
      - "system/**"
      - "game/**"
      - "tools/validate_mana_game_pack.py"
      - "distribution/**"
      - ".github/workflows/mana-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-omega-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: MANA Brain, OS core, Android tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK packages without deprecated tools package
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate game assets and package layout
        run: |
          python3 tools/validate_mana_game_pack.py
          python3 tools/validate_mana_installer_contract.py
          python3 tools/validate_mana_gltf.py launcher/app/src/main/assets/mana_avatar_genesis.gltf

      - name: Test MANA Brain and OS core, test Android app, build APK
        working-directory: launcher
        run: |
          gradle --no-daemon :brain:test :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK package identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="launcher/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKANALYZER"
          test -x "$APKSIGNER"
          test "$("$APKANALYZER" manifest application-id "$APK")" = "com.mana.launcher"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/mana-apk-files.txt"
          grep -Eq '(^|/)liblitertlm_jni\.so
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Omega-debug-APK
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
 "$RUNNER_TEMP/mana-apk-files.txt"
          grep -Eq '(^|/)libsherpa-onnx-jni\.so
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Omega-debug-APK
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
 "$RUNNER_TEMP/mana-apk-files.txt"
          grep -qx 'assets/mana_voice/ru_RU-irina-medium.onnx' "$RUNNER_TEMP/mana-apk-files.txt"
          grep -qx 'assets/mana_voice/tokens.txt' "$RUNNER_TEMP/mana-apk-files.txt"
          grep -qx 'assets/mana_avatar_genesis.gltf' "$RUNNER_TEMP/mana-apk-files.txt"
          grep -q '^assets/mana_voice/espeak-ng-data/' "$RUNNER_TEMP/mana-apk-files.txt"
          sha256sum "$APK"

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Omega-debug-APK
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
