name: MANA XZ Android build

on:
  push:
    branches: [Final]
  pull_request:
    branches: [main]
    paths:
      - "launcher/**"
      - "engine/**"
      - "os/**"
      - "system/**"
      - "distribution/**"
      - ".github/workflows/mana-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Run unit tests
        run: gradle -p launcher --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: gradle -p launcher --no-daemon assembleDebug

      - name: Assemble game-style MANA XZ folder
        run: |
          mkdir -p distribution/MANA_XZ/app
          cp launcher/app/build/outputs/apk/debug/*.apk distribution/MANA_XZ/app/MANA_XZ-debug.apk
          cd distribution
          zip -qr ../MANA_XZ-Android-folder.zip MANA_XZ
          cd ..

      - name: Upload complete MANA XZ folder
        uses: actions/upload-artifact@v4
        with:
          name: MANA-XZ-game-style-folder
          path: MANA_XZ-Android-folder.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MANA-XZ-debug-RMX5566-prototype
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
