name: MANA Microworld Core — JVM verification

on:
  push:
    paths:
      - 'os/core/**'
      - '.github/workflows/mana-microworld-core.yml'
  pull_request:
    paths:
      - 'os/core/**'
      - '.github/workflows/mana-microworld-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build and test Microworld core
        run: gradle --no-daemon -p os/core clean test
