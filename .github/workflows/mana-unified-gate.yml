name: MANA Genesis 4.0 — unified source gate

on:
  push:
    branches: ["**"]
    paths:
      - "os/**"
      - "engine/**"
      - "launcher/**"
      - "system/**"
      - "game/**"
      - "device/**"
      - "kernel/**"
      - "tools/**"
      - "updates/**"
      - ".github/workflows/mana-unified-gate.yml"
  pull_request:
    paths:
      - "os/**"
      - "engine/**"
      - "launcher/**"
      - "system/**"
      - "game/**"
      - "device/**"
      - "kernel/**"
      - "tools/**"
      - "updates/**"
      - ".github/workflows/mana-unified-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aosp16-manifest-pin:
    name: Verify pinned upstream Android 16 manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact AOSP release tag and commit
        run: bash tools/verify_aosp_manifest_pin.sh


  mana-update-channel-tests:
    name: Verify signed MANA update channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ed25519 verification dependency
        run: python -m pip install cryptography
      - name: Test MANA channel isolation, device binding and signature checks
        run: python -m unittest discover -s tools/tests -p 'test_mana_update_manifest.py' -v

  autodev-policy-tests:
    name: Test MANA isolated self-development and kernel patch gates
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test patch path allowlists, traversal rejection and kernel patch policy
        run: python -m unittest discover -s tools/tests -p 'test_mana_autodev.py' -v
      - name: Syntax-check self-development tools without creating repository cache files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ("tools/mana_autodev.py", "tools/validate_mana_kernel_patch.py", "tools/validate_mana_feature_manifest.py"):
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          print("AutoDev and manifest tools have valid Python syntax.")
          PY
      - name: Validate complete owner-requested module inventory
        run: |
          python3 tools/validate_mana_feature_manifest.py
          python -m unittest discover -s tools/tests -p 'test_mana_feature_manifest.py' -v
      - name: Exercise the real isolated candidate worktree and engine test runner
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/mana-autodev-smoke.patch" <<'PATCH'
          diff --git a/engine/mana-brain/src/main/kotlin/com/mana/brain/ManaAutoDevSmoke.kt b/engine/mana-brain/src/main/kotlin/com/mana/brain/ManaAutoDevSmoke.kt
          new file mode 100644
          --- /dev/null
          +++ b/engine/mana-brain/src/main/kotlin/com/mana/brain/ManaAutoDevSmoke.kt
          @@ -0,0 +1,5 @@
          +package com.mana.brain
          +
          +internal object ManaAutoDevSmoke {
          +    const val STATUS = "candidate"
          +}
          PATCH
          python tools/mana_autodev.py --repo . --patch "$RUNNER_TEMP/mana-autodev-smoke.patch" --track engine --output-dir "$RUNNER_TEMP/mana-autodev-candidates"

  core-tests:
    name: MANA OS Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle -p os/core --no-daemon clean test

  brain-tests:
    name: MANA Brain routing and provider tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle -p engine/mana-brain --no-daemon clean test

  android-prototype:
    name: Android launcher, avatar and LiteRT-LM source build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Ensure Android app consumes the single tested MANA Brain module
        run: |
          grep -F 'include(":app", ":core", ":brain", ":system-binder")' launcher/settings.gradle.kts
          grep -F 'project(":brain").projectDir = file("../engine/mana-brain")' launcher/settings.gradle.kts
          grep -F 'implementation(project(":brain"))' launcher/app/build.gradle.kts
          test ! -f launcher/app/src/main/java/com/mana/brain/ManaBrain.kt
      - name: Validate every bundled avatar asset
        run: |
          for model in launcher/app/src/main/assets/mana_avatar_genesis*.gltf; do
            python3 tools/validate_mana_gltf.py "$model"
          done
      - name: Build Android prototype and run unit tests
        working-directory: launcher
        run: gradle --no-daemon :system-binder:assembleDebug :app:assembleDebug :app:testDebugUnitTest
      - name: Publish Android companion APK
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-Android-Companion-APK
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  soong-source-check:
    name: MANA Android product source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
      - name: Compile standalone non-privileged MANA product app sources
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mana-ui-classes"
          javac -source 17 -target 17 \
            -classpath "$ANDROID_HOME/platforms/android-36/android.jar" \
            -d "$RUNNER_TEMP/mana-ui-classes" \
            $(find system/mana/apps -name '*.java' ! -name 'ManaBrainBinderService.java' ! -name 'ManaBrainBinderTest.java' ! -name 'ManaLauncherBrainIntegrationTest.java' ! -name 'ManaHomeActivity.java' ! -name 'ManaAndroidCapabilityExecutor.java' -print)
      - name: Validate MANA Brain and Android 16 Soong wiring
        run: python3 tools/validate_mana_soong_wiring.py
      - name: Validate read-only Termux device audit script
        run: |
          bash -n device/collect_rmx5566_identity.sh
          if grep -En '(^|[[:space:]])(su|dd|fastboot|flash|erase|mkfs|parted)([[:space:]]|$)' device/collect_rmx5566_identity.sh; then
            echo "Unexpected privileged or block-writing command in read-only audit script."
            exit 1
          fi
      - name: Validate pinned RE645F OEM source acquisition and port gates
        run: |
          bash -n device/realme/RE645F/fetch_oem_candidates.sh
          bash -n device/realme/RE645F/report_port_gates.sh
          python3 -m json.tool device/realme/RE645F/oem-source-lock.json >/dev/null
          bash device/realme/RE645F/report_port_gates.sh
      - name: Validate product package declarations and manifests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          # Binder/AIDL and Kotlin runtime are compiled by Soong in a full AOSP tree,
          # not by raw javac against android.jar. Validate the source wiring here.
          assistant_bp = Path("system/mana/apps/ManaAssistant/Android.bp").read_text()
          aidl_bp = Path("system/mana/brain/aidl/Android.bp").read_text()
          binder = Path("system/mana/apps/ManaAssistant/src/com/mana/assistant/ManaBrainBinderService.java").read_text()
          assert "mana.brain-java" in assistant_bp and "mana-brain-core" in assistant_bp
          assert "aidl_interface" in aidl_bp and 'name: "mana.brain"' in aidl_bp
          assert "IBrainService.Stub" in binder and "ManaBrainAndroidRuntime.get()" in binder
          product = Path("system/mana/mana_product.mk").read_text()
          expected = ["ManaLauncher", "ManaAssistant", "ManaSettings", "ManaControlCenter"]
          missing = [name for name in expected if name not in product]
          assert not missing, f"Missing product packages: {missing}"
          ns = "{http://schemas.android.com/apk/res/android}"
          manifests = sorted(Path("system/mana/apps").glob("*/AndroidManifest.xml"))
          assert len(manifests) == 4, f"Expected 4 manifests, got {len(manifests)}"
          for manifest in manifests:
              root = ET.parse(manifest).getroot()
              for activity in root.findall("./application/activity"):
                  assert activity.attrib.get(ns + "exported") in ("true", "false"), f"Missing exported on {manifest}"
              build = (manifest.parent / "Android.bp").read_text()
              assert "privileged: false" in build, f"Unexpected privileged package: {manifest.parent}"
          print("MANA Soong source modules and non-privileged permission boundary validated.")
          PY

  realme-update-bridge:
    name: Build permission-free Realme updater handoff APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enforce zero declared Android permissions and OEM handoff action
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("updates/android-bridge/app/src/main/AndroidManifest.xml").getroot()
          assert not root.findall("uses-permission"), "Updater bridge must not request Android permissions"
          app = root.find("application")
          assert app is not None
          activity = app.find("activity")
          assert activity is not None and activity.attrib.get("{http://schemas.android.com/apk/res/android}exported") == "true"
          source = open("updates/android-bridge/app/src/main/java/com/mana/updatebridge/UpdaterBridgeActivity.kt", encoding="utf-8").read()
          assert 'Intent("android.settings.SYSTEM_UPDATE_SETTINGS")' in source
          assert "Settings.ACTION_SETTINGS" in source
          print("Updater bridge requests no permissions and uses OEM update settings handoff.")
          PY
      - name: Build MANA +1 updater handoff
        run: gradle -p updates/android-bridge --no-daemon :app:assembleDebug
      - name: Verify APK package metadata and no declared permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk = Path("updates/android-bridge/app/build/outputs/apk/debug/app-debug.apk")
          assert apk.is_file() and apk.stat().st_size > 0
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              assert "AndroidManifest.xml" in names
              assert any(n.startswith("classes") and n.endswith(".dex") for n in names)
          print(f"Built MANA +1 handoff APK: {apk.stat().st_size} bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MANA-Realme-MANA-Plus-1-Updater-Bridge-APK
          path: updates/android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  package-source:
    name: Create one unified MANA source archive
    runs-on: ubuntu-latest
    needs: [core-tests, brain-tests, android-prototype, soong-source-check, autodev-policy-tests, realme-update-bridge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MANA-Genesis-4.0-Android-Companion-APK
          path: dist/android-companion
      - uses: actions/download-artifact@v4
        with:
          name: MANA-Realme-MANA-Plus-1-Updater-Bridge-APK
          path: dist/realme-update-bridge
      - name: Download and verify the complete offline Gemma 4 E2B model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/local-model
          curl --fail --location --retry 5 --retry-all-errors \
            "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/21c646194210256750db12cfa1e4fdf22bd3ddf1/gemma-4-E2B-it.litertlm" \
            --output dist/local-model/gemma-4-E2B-it.litertlm
          test "$(stat -c%s dist/local-model/gemma-4-E2B-it.litertlm)" = "2588147712"
          echo "181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c  dist/local-model/gemma-4-E2B-it.litertlm" | sha256sum --check -
          cp models/APACHE-2.0-LICENSE.txt dist/MODEL_LICENSE_APACHE-2.0.txt
          cp os/MANA_GENESIS_4.0_COMPLETE_FEATURE_MANIFEST.json dist/MANA_FEATURE_MANIFEST.json
          cp docs/MANA_ARCHITECTURE_RU.md dist/MANA_ARCHITECTURE_RU.md
      - name: Package all current MANA source modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import subprocess
          excluded_dirs = {".git", ".gradle", "build", ".idea"}
          excluded_names = {"local.properties"}
          tracked = subprocess.check_output(["git", "ls-files", "-z"])
          files = [name for name in tracked.decode("utf-8").split(chr(0)) if name]
          if not files:
              raise SystemExit("Refusing to publish an empty source archive: git ls-files returned no paths")
          added = 0
          with ZipFile("dist/MANA_Genesis_4.0_UNIFIED_SOURCE.zip", "w", ZIP_DEFLATED) as archive:
              for name in files:
                  path = Path(name)
                  if any(part in excluded_dirs for part in path.parts):
                      continue
                  if path.name in excluded_names or path.name.startswith("secrets") or path.name.startswith(".env") or path.suffix in {".keystore", ".jks", ".zip"}:
                      continue
                  if path.is_file():
                      archive.write(path, name)
                      added += 1
          if added == 0:
              raise SystemExit("Refusing to publish an empty source archive: no tracked files were packaged")
          with ZipFile("dist/MANA_Genesis_4.0_UNIFIED_SOURCE.zip") as check:
              bad = check.testzip()
              if bad is not None or len(check.namelist()) != added:
                  raise SystemExit(f"Source archive integrity/count check failed: bad={bad}, expected={added}, actual={len(check.namelist())}")
          print(f"Packaged and verified {added} tracked source files.")
          PY
          cat > dist/ROM_STATUS.txt <<'EOF'
          MANA Genesis 4.0 source archive + Android companion bundle.
          NOT A FLASHABLE ROM. NOT AN OTA. The APK is a debug companion build.
          The archive includes tracked project source and build workflows.
          No complete AOSP checkout, RMX5566RU-matched device tree/kernel/vendor set,
          AVB signing chain, partition metadata, tested recovery or device acceptance
          evidence is present in this repository. Do not flash this bundle.
          EOF
          cat > dist/BUILD_STATUS.txt <<'EOF'
          MANA Genesis 4.0 — release contents
          - UNIFIED_SOURCE.zip: all tracked project source, docs and workflows (sensitive build-local files excluded).
          - UPDATE_PACKAGE.zip: MANA companion APK, Realme updater handoff APK, full offline Gemma 4 E2B weights and Apache-2.0 license text.
          - android-companion/app-debug.apk: debug Android companion; not a firmware installer.
          - realme-update-bridge/app-debug.apk: permission-free handoff to the OEM system-update settings; it does not install a MANA ROM or bypass OEM signature checks.
          - ROM_STATUS.txt: explicit device/ROM readiness limitation.
          - SHA256SUMS.txt: checksums for source, APKs, model, update package and complete bundle.
          AOSP source modules and JVM/Android prototypes are not equivalent to a bootable device ROM.
          Device-specific RMX5566RU validation is still required.
          EOF
          sha256sum dist/MANA_Genesis_4.0_UNIFIED_SOURCE.zip > dist/SHA256SUMS.txt
          sha256sum dist/android-companion/app-debug.apk >> dist/SHA256SUMS.txt
          sha256sum dist/realme-update-bridge/app-debug.apk >> dist/SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("dist")
          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()
          payloads = []
          for rel, kind in (
              ("android-companion/app-debug.apk", "companion_apk"),
              ("realme-update-bridge/app-debug.apk", "companion_apk"),
              ("local-model/gemma-4-E2B-it.litertlm", "model_bundle"),
          ):
              p = root / rel
              payloads.append({
                  "file": rel,
                  "kind": kind,
                  "size": p.stat().st_size,
                  "sha256": sha256_file(p),
              })
          update = {
              "format": "MANA-Genesis-4.0-userspace-preview",
              "release": "MANA +1",
              "version_code": 1,
              "target": {"model": "RMX5566RU", "device": "RE645F", "android_api": 36},
              "base_fingerprint": "realme/RMX5566RU/RE645F:16/BP2A.250605.015/V.2f025ac-8895bb-9a8318:user/release-keys",
              "payloads": payloads,
              "install_mode": "manual APK installation plus bundled offline model import",
              "is_oem_ota": False,
              "is_flashable_rom": False,
              "installs_firmware": False,
              "status": "offline_ai_preview_bundle_not_system_update",
              "limitations": [
                  "Debug companion APK is not a privileged/system app.",
              "Bundled Gemma 4 E2B weights must be imported into the app after APK installation.",
              "Gemma 4 E2B has not been benchmarked on the target RMX5566RU; local inference performance is not guaranteed.",
                  "Updater bridge only opens Realme system update settings.",
                  "No RMX5566RU flashable system image is included.",
                  "No OEM signing or bootloader bypass is included."
              ],
              "feature_manifest": {
                  "file": "MANA_FEATURE_MANIFEST.json",
                  "module_count": len(json.loads(Path("os/MANA_GENESIS_4.0_COMPLETE_FEATURE_MANIFEST.json").read_text(encoding="utf-8"))["modules"]),
                  "note": "Owner-requested feature inventory; individual entries may be prototypes or specifications rather than completed system services."
              }
          }
          (root / "MANA_UPDATE_INFO.json").write_text(json.dumps(update, indent=2) + chr(10), encoding="utf-8")
          (root / "MANA_UPDATE_README_RU.txt").write_text(chr(10).join([
              "MANA Genesis 4.0 — единый локальный пакет компонентов",
              "Внутри: Android APK MANA с LiteRT-LM runtime, APK-переходник Realme, Gemma 4 E2B (2,588,147,712 байт), полный текст Apache-2.0, архитектурный документ и полный каталог согласованных функций MANA.",
              "1. Распакуй ZIP в память телефона.",
              "2. Установи android-companion/app-debug.apk и открой MANA.",
              "3. В MANA открой выбор локальной модели и импортируй local-model/gemma-4-E2B-it.litertlm.",
              "4. Дождись сообщения об успешной загрузке локальной модели. После этого генерация работает без интернета.",
              "5. realme-update-bridge/app-debug.apk только открывает настройки штатного обновления Realme; он не прошивает устройство.",
              "Оставь несколько гигабайт свободной памяти. Реальная скорость и устойчивость Gemma 4 E2B на RMX5566RU ещё не подтверждены тестом на самом телефоне.",
              "MANA_FEATURE_MANIFEST.json содержит полный перечень согласованных направлений и модулей; некоторые из них пока являются прототипами или спецификациями, а не завершёнными системными службами.",
              "Облачные провайдеры не включены по умолчанию; для них нужны собственные API-ключи и отдельное согласие.",
              "Это пакет пользовательских компонентов MANA, не прошивка и не OTA. Он не заменяет Realme UI, не разблокирует загрузчик и не меняет системные разделы.",
              "Перед установкой APK разреши установку из выбранного источника Android."
          ]) + chr(10), encoding="utf-8")
          PY
          sha256sum dist/MANA_UPDATE_INFO.json >> dist/SHA256SUMS.txt
          sha256sum dist/MANA_UPDATE_README_RU.txt >> dist/SHA256SUMS.txt
          sha256sum dist/MANA_FEATURE_MANIFEST.json >> dist/SHA256SUMS.txt
          sha256sum dist/MANA_ARCHITECTURE_RU.md >> dist/SHA256SUMS.txt
          (cd dist && zip -q MANA_Genesis_4.0_UPDATE_PACKAGE.zip MANA_UPDATE_INFO.json MANA_UPDATE_README_RU.txt MANA_FEATURE_MANIFEST.json MANA_ARCHITECTURE_RU.md MODEL_LICENSE_APACHE-2.0.txt android-companion/app-debug.apk realme-update-bridge/app-debug.apk)
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_STORED
          with ZipFile("dist/MANA_Genesis_4.0_UPDATE_PACKAGE.zip", "a", compression=ZIP_STORED, allowZip64=True) as archive:
              archive.write("dist/local-model/gemma-4-E2B-it.litertlm", "local-model/gemma-4-E2B-it.litertlm")
              archive.testzip()
          PY
          sha256sum dist/local-model/gemma-4-E2B-it.litertlm >> dist/SHA256SUMS.txt
          sha256sum dist/MODEL_LICENSE_APACHE-2.0.txt >> dist/SHA256SUMS.txt
          sha256sum dist/MANA_Genesis_4.0_UPDATE_PACKAGE.zip >> dist/SHA256SUMS.txt
          (cd dist && zip -q MANA_Genesis_4.0_COMPLETE_BUNDLE.zip MANA_Genesis_4.0_UNIFIED_SOURCE.zip MANA_Genesis_4.0_UPDATE_PACKAGE.zip MANA_UPDATE_INFO.json MANA_UPDATE_README_RU.txt ROM_STATUS.txt BUILD_STATUS.txt SHA256SUMS.txt android-companion/app-debug.apk realme-update-bridge/app-debug.apk)
          sha256sum dist/MANA_Genesis_4.0_COMPLETE_BUNDLE.zip >> dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-Update-Package
          path: dist/MANA_Genesis_4.0_UPDATE_PACKAGE.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-unified-source
          path: |
            dist/MANA_Genesis_4.0_UNIFIED_SOURCE.zip
            dist/MANA_Genesis_4.0_COMPLETE_BUNDLE.zip
            dist/MANA_UPDATE_INFO.json
            dist/MANA_UPDATE_README_RU.txt
            dist/ROM_STATUS.txt
            dist/BUILD_STATUS.txt
            dist/SHA256SUMS.txt
            dist/android-companion/app-debug.apk
            dist/realme-update-bridge/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
