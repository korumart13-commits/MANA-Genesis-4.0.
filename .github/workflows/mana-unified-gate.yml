name: MANA Genesis 4.0 — unified source gate

on:
  push:
    branches: ["**"]
    paths:
      - "os/**"
      - "engine/**"
      - "launcher/**"
      - "system/**"
      - "game/**"
      - "device/**"
      - "kernel/**"
      - "tools/**"
      - ".github/workflows/mana-unified-gate.yml"
  pull_request:
    paths:
      - "os/**"
      - "engine/**"
      - "launcher/**"
      - "system/**"
      - "game/**"
      - "device/**"
      - "kernel/**"
      - "tools/**"
      - ".github/workflows/mana-unified-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: MANA OS Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle -p os/core --no-daemon clean test

  brain-tests:
    name: MANA Brain routing and provider tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle -p engine/mana-brain --no-daemon clean test

  android-prototype:
    name: Android launcher, avatar and LiteRT-LM source build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Ensure Android Brain mirror matches tested Brain source
        run: diff -u engine/mana-brain/src/main/kotlin/com/mana/brain/ManaBrain.kt launcher/app/src/main/java/com/mana/brain/ManaBrain.kt
      - name: Validate every bundled avatar asset
        run: |
          for model in launcher/app/src/main/assets/mana_avatar_genesis*.gltf; do
            python3 tools/validate_mana_gltf.py "$model"
          done
      - name: Build Android prototype and run unit tests
        working-directory: launcher
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest

  soong-source-check:
    name: MANA Android product source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
      - name: Compile non-privileged MANA product apps
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mana-ui-classes"
          javac -source 17 -target 17 \
            -classpath "$ANDROID_HOME/platforms/android-36/android.jar" \
            -d "$RUNNER_TEMP/mana-ui-classes" \
            $(find system/mana/apps -name '*.java' -print)
      - name: Validate product package declarations and manifests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          product = Path("system/mana/mana_product.mk").read_text()
          expected = ["ManaLauncher", "ManaAssistant", "ManaSettings", "ManaControlCenter"]
          missing = [name for name in expected if name not in product]
          assert not missing, f"Missing product packages: {missing}"
          ns = "{http://schemas.android.com/apk/res/android}"
          manifests = sorted(Path("system/mana/apps").glob("*/AndroidManifest.xml"))
          assert len(manifests) == 4, f"Expected 4 manifests, got {len(manifests)}"
          for manifest in manifests:
              root = ET.parse(manifest).getroot()
              for activity in root.findall("./application/activity"):
                  assert activity.attrib.get(ns + "exported") in ("true", "false"), f"Missing exported on {manifest}"
              build = (manifest.parent / "Android.bp").read_text()
              assert "privileged: false" in build, f"Unexpected privileged package: {manifest.parent}"
          print("MANA Soong source modules and non-privileged permission boundary validated.")
          PY

  package-source:
    name: Create one unified MANA source archive
    runs-on: ubuntu-latest
    needs: [core-tests, brain-tests, android-prototype, soong-source-check]
    steps:
      - uses: actions/checkout@v4
      - name: Package all current MANA source modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/MANA_Genesis_4.0_UNIFIED_SOURCE.zip \
            os engine launcher system game tools device kernel models privacy docs platform README.md \
            -x '*/build/*' '*/.gradle/*' '*/.git/*' '*/local.properties' \
               '*/secrets*' '*/.*keystore' '*/.env*' '*.zip'
          cat > dist/ROM_STATUS.txt <<'EOF'
          MANA Genesis 4.0 source archive only.
          NOT A FLASHABLE ROM. NOT AN OTA. NOT AN APK.
          No complete AOSP checkout, RMX5566RU-matched device tree/kernel/vendor set,
          AVB signing chain, partition metadata, tested recovery or device acceptance
          evidence is present in this repository. Do not flash this archive.
          EOF
          sha256sum dist/MANA_Genesis_4.0_UNIFIED_SOURCE.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-unified-source
          path: dist/*
          if-no-files-found: error
          retention-days: 30
