name: MANA Genesis 4.0 Complete Bundle

# Run manually. Commits made by GitHub's token do not reliably trigger another workflow.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: mana-complete-bundle
  cancel-in-progress: false

jobs:
  assemble:
    name: Verify inputs and assemble one complete archive
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout the latest source tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Android SDK tools for APK signature checks
        uses: android-actions/setup-android@v3

      - name: Download successful upstream build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw/full raw/debug raw/release
          gh run download 45937236960 --repo "$GH_REPO" --name "MANA-Martynova-FULL-PACKAGE-APK-AND-AI" --dir raw/full
          gh run download 45937236960 --repo "$GH_REPO" --name "MANA-Android-debug-prototype-NOT-ROM" --dir raw/debug
          gh run download 45937236960 --repo "$GH_REPO" --name "MANA-Android-release-unsigned-for-AOSP-platform-signing" --dir raw/release
          FULL_ZIP="$(find raw/full -type f -name 'MANA-Martynova-FULL-PACKAGE.zip' -print -quit)"
          test -n "$FULL_ZIP"
          unzip -tq "$FULL_ZIP"
          mkdir -p raw/full/extracted
          unzip -q "$FULL_ZIP" -d raw/full/extracted
          MODEL="$(find raw/full/extracted -type f -name '*.litertlm' -print -quit)"
          test -n "$MODEL"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          test -n "$(find raw/debug -type f -name '*.apk' -print -quit)"
          test -n "$(find raw/release -type f -name '*.apk' -print -quit)"

      - name: Verify the official Gemma model and LiteRT-LM dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(basename "$MODEL")" = "MANA-Martynova-AI-Gemma4-E2B.litertlm"
          test "$(stat -c '%s' "$MODEL")" -gt 2500000000
          test "$(stat -c '%s' "$MODEL")" -lt 3000000000
          echo "181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c  $MODEL" | sha256sum --check -
          grep -F 'com.google.ai.edge.litertlm:litertlm-android:0.16.1' launcher/app/build.gradle.kts
          grep -F 'include(":app", ":core", ":brain")' launcher/settings.gradle.kts
          grep -F 'implementation(project(":brain"))' launcher/app/build.gradle.kts

      - name: Verify APKs and signatures
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find raw/debug -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find raw/release -type f -name '*.apk' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$APKANALYZER"
          "$APKSIGNER" verify --verbose "$DEBUG_APK"
          "$APKANALYZER" manifest application-id "$DEBUG_APK" | grep -Fx 'com.mana.launcher'
          "$APKANALYZER" manifest application-id "$RELEASE_APK" | grep -Fx 'com.mana.launcher'
          if "$APKSIGNER" verify "$RELEASE_APK" >/dev/null 2>&1; then
            echo "Expected the AOSP platform-signing release APK to be unsigned, but it is signed." >&2
            exit 1
          fi
          echo "DEBUG_APK=$DEBUG_APK" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"

      - name: Assemble a single unified directory from latest source and verified payloads
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/MANA_Genesis_4.0_COMPLETE"
          mkdir -p "$ROOT/01_Source_LATEST" "$ROOT/02_Local_AI_Gemma_LiteRT" "$ROOT/03_APK_Installers/Debug_signed" "$ROOT/03_APK_Installers/Release_unsigned" "$ROOT/04_Documentation"
          rsync -a --exclude='.git/' --exclude='raw/' --exclude='dist/' ./ "$ROOT/01_Source_LATEST/"
          cp "$MODEL" "$ROOT/02_Local_AI_Gemma_LiteRT/"
          cp "$DEBUG_APK" "$ROOT/03_APK_Installers/Debug_signed/MANA-Genesis-4.0-debug.apk"
          cp "$RELEASE_APK" "$ROOT/03_APK_Installers/Release_unsigned/MANA-Genesis-4.0-release-unsigned.apk"
          cp raw/full/extracted/README-FIRST-RU.txt "$ROOT/04_Documentation/" 2>/dev/null || true
          git rev-parse HEAD > "$ROOT/04_Documentation/SOURCE_COMMIT.txt"
          printf 'Source repository: %s\nUpstream successful build run: 45937236960\nBundle run: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$ROOT/04_Documentation/BUILD_ORIGIN.txt"
          cat > "$ROOT/README_FIRST_RU.txt" <<'EOF'
          MANA GENESIS 4.0 — ЕДИНЫЙ ПРОВЕРЕННЫЙ КОМПЛЕКТ

          Состав:
          01_Source_LATEST/             Последние исходники из main на момент сборки.
          02_Local_AI_Gemma_LiteRT/     Официальная модель Gemma 4 E2B LiteRT-LM.
          03_APK_Installers/            Подписанный debug APK и unsigned release APK.
          04_Documentation/             Сведения о сборке и SHA-256 манифест.

          Установка APK:
          Используйте APK из Debug_signed. Release_unsigned предназначен для
          платформенной подписи в AOSP и обычным установщиком Android не ставится.

          Модель:
          Это отдельный многогигабайтный файл .litertlm, а не часть APK.
          Для загрузки в MANA требуется поддержка импорта модели в приложении,
          достаточно свободного места и совместимое устройство.

          ГРАНИЦЫ:
          Это единый архив исходников, APK и модели, но НЕ прошивка/ROM/OTA.
          Наличие файла модели и зависимости LiteRT-LM не доказывает, что
          модель уже интегрирована в интерфейс приложения или проверена на телефоне.
          APK не получает root/system privileges и не меняет разделы устройства.
          EOF
          cp "$ROOT/README_FIRST_RU.txt" "$ROOT/04_Documentation/README_FIRST_RU.txt"

      - name: Remove exact duplicates and create complete SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/MANA_Genesis_4.0_COMPLETE"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path(os.environ["RUNNER_TEMP"]) / "MANA_Genesis_4.0_COMPLETE"
          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()
          seen, removed = {}, []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              digest = sha256(path)
              if digest in seen:
                  removed.append((str(path.relative_to(root)), seen[digest]))
                  path.unlink()
              else:
                  seen[digest] = str(path.relative_to(root))
          docs = root / "04_Documentation"
          with (docs / "DUPLICATES_REMOVED.txt").open("w", encoding="utf-8") as f:
              f.write("Exact SHA-256 duplicates removed:\n")
              for current, original in removed:
                  f.write(f"{current} == {original}\n")
              if not removed:
                  f.write("None found.\n")
          with (docs / "SHA256SUMS.txt").open("w", encoding="utf-8") as f:
              for path in sorted(p for p in root.rglob("*") if p.is_file() and p.name != "SHA256SUMS.txt"):
                  f.write(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}\n")
          print(f"Retained {len(seen)} unique files; removed {len(removed)} exact duplicates.")
          PY

      - name: Final integrity and completeness gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/MANA_Genesis_4.0_COMPLETE"
          test -s "$ROOT/README_FIRST_RU.txt"
          test "$(find "$ROOT/02_Local_AI_Gemma_LiteRT" -type f -name '*.litertlm' | wc -l)" -eq 1
          test -s "$ROOT/03_APK_Installers/Debug_signed/MANA-Genesis-4.0-debug.apk"
          test -s "$ROOT/03_APK_Installers/Release_unsigned/MANA-Genesis-4.0-release-unsigned.apk"
          test -s "$ROOT/01_Source_LATEST/launcher/app/build.gradle.kts"
          grep -Fq 'com.google.ai.edge.litertlm:litertlm-android:0.16.1' "$ROOT/01_Source_LATEST/launcher/app/build.gradle.kts"
          (cd "$ROOT" && sha256sum -c 04_Documentation/SHA256SUMS.txt)
          find "$ROOT" -type f -printf '%s %p\n' | sort -nr | head -20
          du -sh "$ROOT"

      - name: Upload the single unified MANA bundle
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-COMPLETE-SOURCE-APK-GEMMA-LITERT
          path: ${{ runner.temp }}/MANA_Genesis_4.0_COMPLETE/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
