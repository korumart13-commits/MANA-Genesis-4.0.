name: MANA Genesis 4.0 — source bundle
# Reproducible source snapshot; this does not claim to be a flashable ROM.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "os/**"
      - "engine/**"
      - "launcher/**"
      - "system/**"
      - "game/**"
      - "tools/**"
      - "platform/**"
      - ".github/workflows/mana-source-bundle.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate platform bootstrap scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n platform/bootstrap_aosp16.sh
          bash -n platform/build_mana_platform_modules.sh
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = ET.parse("platform/local_manifests/mana.xml").getroot()
          project = root.find("./project[@path='vendor/mana/genesis']")
          assert project is not None
          assert project.attrib["revision"] == "2a1e61013bb485b2214c62c77d76ee7696a95f20"
          assert pathlib.Path("device/RMX5566RU_FIRMWARE_BRINGUP_GATE_2026-11-27.md").exists()
          print("AOSP bootstrap shell syntax and pinned MANA manifest validated.")
          PY
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/MANA_Genesis_4.0_Source.zip \
            os engine launcher system game tools platform device kernel .github/workflows \
            README.md 2>/dev/null \
            -x '*/build/*' '*/.gradle/*' '*/.git/*' '*/local.properties' \
               '*/secrets*' '*/.*keystore' '*/.env*'
          if [ -d game/minecraft-bedrock/MANA_Companion_BP ]; then
            (cd game/minecraft-bedrock && zip -r ../../dist/MANA_Genesis_4.0_Minecraft.mcpack MANA_Companion_BP)
          fi
          sha256sum dist/* > dist/SHA256SUMS.txt
          du -h dist/*
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-source
          path: dist/*
          if-no-files-found: error
          retention-days: 30
