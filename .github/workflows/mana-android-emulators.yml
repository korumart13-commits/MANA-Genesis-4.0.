name: MANA RMX5566RU Android 16 Compatibility Smoke Test

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/mana-android-emulators.yml"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/mana-android-emulators.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-rmx5566-android16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android16-smoke:
    name: Android 16 API 36 build/runtime smoke (not OEM hardware proof)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Run unit tests and build Android 16 APK
        working-directory: launcher
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Run Android 16 API 36 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: cd launcher && gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload API 36 debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mana-rmx5566-android16-api36-debug
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
