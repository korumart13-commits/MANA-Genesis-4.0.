name: MANA Android Emulator Compatibility

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/mana-android-emulators.yml"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/mana-android-emulators.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-android-emulators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-tests:
    name: Android API ${{ matrix.api-level }} instrumentation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api-level: [28, 30, 33, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run JVM unit tests and build APK
        working-directory: launcher
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Run profiler tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: cd launcher && gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mana-debug-api-${{ matrix.api-level }}
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
