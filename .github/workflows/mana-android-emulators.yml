name: MANA Android Emulator Compatibility

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/mana-android-emulators.yml"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/mana-android-emulators.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-android-emulators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-tests:
    name: Android ${{ matrix.android-name }} / ${{ matrix.device-name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # Android 12 = API 31; Android 15 = API 35; Android 16 = API 36.
          # Pixel AVDs provide repeatable hardware classes, not OEM firmware emulation.
          - android-name: "12 (API 31)"
            api-level: 31
            device-name: "compact-phone profile"
            avd-profile: pixel_2
          - android-name: "15 (API 35)"
            api-level: 35
            device-name: "compact-phone profile"
            avd-profile: pixel_2
          - android-name: "16 (API 36)"
            api-level: 36
            device-name: "compact-phone profile"
            avd-profile: pixel_2
          - android-name: "12 (API 31)"
            api-level: 31
            device-name: "large-phone profile"
            avd-profile: pixel_6
          - android-name: "15 (API 35)"
            api-level: 35
            device-name: "large-phone profile"
            avd-profile: pixel_6
          - android-name: "16 (API 36)"
            api-level: 36
            device-name: "large-phone profile"
            avd-profile: pixel_6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Run JVM unit tests and build APK
        working-directory: launcher
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Run profiler tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.avd-profile }}
          disable-animations: true
          script: cd launcher && gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mana-debug-api-${{ matrix.api-level }}-${{ matrix.avd-profile }}
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7
