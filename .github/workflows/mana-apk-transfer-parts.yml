name: Split full MANA APK for phone transfer
on:
  push:
    branches:
      - mana-genesis-4-rmx5566-rom-port
    paths:
      - .github/workflows/mana-apk-transfer-parts.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: MANA-Genesis-4.0-Full-Offline-APK-Gemma4-E4B
          path: incoming
          repository: ${{ github.repository }}
          run-id: 45856525889
          github-token: ${{ github.token }}
      - name: Split APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted parts
          find incoming -type f -maxdepth 3 -print
          unzip -q incoming/*.zip -d extracted
          APK="$(find extracted -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          split -b 450000000 --numeric-suffixes=0 --suffix-length=2 "$APK" parts/MANA-Genesis-4.0.apk.part-
          sha256sum "$APK" | tee parts/SHA256SUMS.txt
          printf '%s\n' "$(basename "$APK")" > parts/APK_FILENAME.txt
          printf '%s\n' "$(stat -c%s "$APK")" > parts/APK_SIZE.txt
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: MANA-APK-Part-00
          path: parts/MANA-Genesis-4.0.apk.part-00
          compression-level: 0
          retention-days: 30
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: MANA-APK-Part-01
          path: parts/MANA-Genesis-4.0.apk.part-01
          compression-level: 0
          retention-days: 30
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: MANA-APK-Part-02
          path: parts/MANA-Genesis-4.0.apk.part-02
          compression-level: 0
          retention-days: 30
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: MANA-APK-Part-03
          path: parts/MANA-Genesis-4.0.apk.part-03
          compression-level: 0
          retention-days: 30
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: MANA-APK-Part-04
          path: parts/MANA-Genesis-4.0.apk.part-04
          compression-level: 0
          retention-days: 30
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: MANA-APK-Part-05
          path: parts/MANA-Genesis-4.0.apk.part-05
          compression-level: 0
          retention-days: 30
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with:
          name: MANA-APK-Part-06
          path: parts/MANA-Genesis-4.0.apk.part-06
          compression-level: 0
          retention-days: 30
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with:
          name: MANA-APK-Part-07
          path: parts/MANA-Genesis-4.0.apk.part-07
          compression-level: 0
          retention-days: 30
      - name: Upload part 08
        uses: actions/upload-artifact@v4
        with:
          name: MANA-APK-Part-08
          path: parts/MANA-Genesis-4.0.apk.part-08
          compression-level: 0
          retention-days: 30
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: MANA-APK-Metadata
          path: |
            parts/SHA256SUMS.txt
            parts/APK_FILENAME.txt
            parts/APK_SIZE.txt
          compression-level: 0
          retention-days: 30
