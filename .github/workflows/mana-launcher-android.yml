name: MANA Launcher — Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/mana-launcher-android.yml'
permissions:
  contents: read
concurrency:
  group: mana-launcher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build launcher APK
        run: gradle -p launcher --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -s launcher/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MANA-Launcher-debug-APK
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
