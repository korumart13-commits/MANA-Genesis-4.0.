name: MANA Genesis 4.0 launcher APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'updates/android-bridge/**'
      - '.github/workflows/mana-permission-bridge-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: updates/android-bridge
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s updates/android-bridge/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-Launcher-Preview-2
          path: updates/android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
