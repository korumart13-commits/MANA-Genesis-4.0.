name: MANA Universal Android Emulator — install and launch matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 33, 36]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run MANA Brain, OS core and Android app unit tests; build debug APK
        working-directory: launcher
        run: gradle --no-daemon :brain:test :core:test :app:testDebugUnitTest :app:assembleDebug
      - name: Run instrumentation tests, then install/launch MANA on Android API ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          disable-linux-hw-accel: false
          pre-emulator-launch-script: |
            sudo chmod 666 /dev/kvm 2>/dev/null || true
            adb start-server
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 -cores 2
          script: bash "$GITHUB_WORKSPACE/tools/run_mana_emulator_smoke.sh"

      - name: Upload RMX5566RU-targeted Android 16 debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Android-API${{ matrix.api-level }}-debug-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
