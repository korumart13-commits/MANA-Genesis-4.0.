name: MANA Universal Android Emulator — install and launch matrix

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - 'engine/mana-brain/**'
      - 'os/core/**'
      - 'tools/mana_emulator_smoke.sh'
      - '.github/workflows/mana-emulator-smoke.yml'

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 33, 36]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run MANA Brain, OS core and Android app unit tests; build debug APK
        working-directory: launcher
        run: gradle --no-daemon :brain:test :core:test :app:testDebugUnitTest :app:assembleDebug
      - name: Boot Android API ${{ matrix.api-level }} emulator and install/launch MANA
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: ${{ matrix.api-level }}
          emulator-boot-timeout: 1200
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash tools/mana_emulator_smoke.sh

      - name: Upload MANA universal Android debug APK (API ${{ matrix.api-level }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Android-API${{ matrix.api-level }}-debug-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
