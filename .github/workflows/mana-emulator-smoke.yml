name: MANA Universal Android Emulator — install and launch matrix

on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - 'engine/mana-brain/**'
      - 'os/core/**'
      - '.github/workflows/mana-emulator-smoke.yml'

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 33, 36]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run MANA Brain, OS core and Android app unit tests; build debug APK
        working-directory: launcher
        run: gradle --no-daemon :brain:test :core:test :app:testDebugUnitTest :app:assembleDebug
      - name: Run instrumentation tests, then install/launch MANA on Android API ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          env:
            ANDROID_I_WANT_MY_TCG: "yes"
          script: |
            set -euo pipefail
            gradle --no-daemon -p launcher :app:connectedDebugAndroidTest
            APK="launcher/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            adb install -r "$APK"
            adb shell pm path com.mana.launcher
            adb shell monkey -p com.mana.launcher -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.mana.launcher
            if adb logcat -d -t 12000 | grep -E 'FATAL EXCEPTION|Fatal signal [0-9]+|Process: com.mana.launcher' ; then
              echo "A fatal application crash was detected in the emulator log." >&2
              exit 1
            fi
            adb shell dumpsys activity activities | grep -E 'com.mana.launcher|mResumedActivity'
            echo "PASS: emulator booted, APK installed, MANA launch process observed, no fatal crash signature found."

      - name: Upload RMX5566RU-targeted Android 16 debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Android-API${{ matrix.api-level }}-debug-APK
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
