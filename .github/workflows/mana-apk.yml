name: MANA Genesis 4.0 — APK only

on:
  push:
    branches:
      - Final
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and verify MANA Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Final source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate MANA assets and installer contract
        run: |
          python3 tools/validate_mana_game_pack.py
          python3 tools/validate_mana_installer_contract.py
          python3 tools/validate_mana_gltf.py launcher/app/src/main/assets/mana_avatar_genesis.gltf

      - name: Run Brain, Core and Android unit tests; assemble debug APK
        working-directory: launcher
        run: |
          gradle --no-daemon :brain:test :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK identity, signature and required offline assets
        shell: bash
        run: |
          set -euo pipefail
          APK="launcher/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKANALYZER"
          test -x "$APKSIGNER"
          test "$("$APKANALYZER" manifest application-id "$APK")" = "com.mana.launcher"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/mana-apk-files.txt"
          grep -Eq '(^|/)liblitertlm_jni\.so$' "$RUNNER_TEMP/mana-apk-files.txt"
          grep -Eq '(^|/)libsherpa-onnx-jni\.so$' "$RUNNER_TEMP/mana-apk-files.txt"
          grep -qx 'assets/mana_voice/ru_RU-irina-medium.onnx' "$RUNNER_TEMP/mana-apk-files.txt"
          grep -qx 'assets/mana_voice/tokens.txt' "$RUNNER_TEMP/mana-apk-files.txt"
          grep -qx 'assets/mana_avatar_genesis.gltf' "$RUNNER_TEMP/mana-apk-files.txt"
          grep -q '^assets/mana_voice/espeak-ng-data/' "$RUNNER_TEMP/mana-apk-files.txt"
          sha256sum "$APK" | tee "$RUNNER_TEMP/MANA-APK-SHA256.txt"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-APK
          path: |
            launcher/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/MANA-APK-SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
