name: MANA OS visual assets

on:
  push:
    paths:
      - 'tools/mana-visual-assets/**'
      - '.github/workflows/mana-visual-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image generator dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate MANA boot animation and lock-screen wallpaper
        run: python tools/mana-visual-assets/generate.py
      - name: Validate boot animation archive
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p = Path("out/mana-visual-assets/bootanimation.zip")
          with ZipFile(p) as z:
              names = z.namelist()
              assert "desc.txt" in names
              assert len([n for n in names if n.startswith("part0/") and n.endswith(".png")]) == 24
              assert z.testzip() is None
          assert Path("out/mana-visual-assets/mana-lockscreen-wallpaper.png").stat().st_size > 10000
          print("MANA visual assets validated.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MANA-OS-visual-assets
          path: out/mana-visual-assets/
          if-no-files-found: error
          retention-days: 30
