name: MANA Brain and Android integration

on:
  push:
    branches:
      - mana-genesis-4-system-launcher-and-port-gates
  pull_request:
    branches:
      - mana-genesis-4-system-launcher-and-port-gates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-brain-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brain-and-os-tests:
    name: Canonical Kotlin/JVM tests and Soong source gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Test canonical Brain engine
        run: gradle --no-daemon -p engine/mana-brain test
      - name: Test OS Core
        run: gradle --no-daemon -p os/core test
      - name: Validate Android Binder, Soong and instrumentation source wiring
        run: bash tools/verify_mana_android_integration.sh

  companion-android-build:
    name: Build existing MANA Genesis Android companion
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Run companion unit tests and build debug APK
        run: gradle --no-daemon -p launcher :app:testDebugUnitTest :app:assembleDebug
      - name: Upload companion debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mana-genesis-companion-debug
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
