name: MANA Launcher — Gradle source verification

on:
  push:
    paths:
      - 'launcher/**'
      - 'system/mana/android-binder/**'
      - 'system/mana/brain/aidl/**'
      - 'system/mana/apps/ManaAssistant/src/**'
      - 'system/mana/apps/ManaLauncher/src/**'
      - '.github/workflows/mana-launcher.yml'
      - 'tools/validate_mana_gltf.py'
      - 'tools/tests/test_mana_feature_manifest.py'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/mana-launcher.yml'
      - 'tools/tests/test_mana_feature_manifest.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify Android app consumes the canonical tested Brain module
        working-directory: .
        run: |
          grep -F 'include(":app", ":core", ":brain", ":system-binder")' launcher/settings.gradle.kts
          grep -F 'project(":brain").projectDir = file("../engine/mana-brain")' launcher/settings.gradle.kts
          grep -F 'implementation(project(":brain"))' launcher/app/build.gradle.kts
          test ! -f launcher/app/src/main/java/com/mana/brain/ManaBrain.kt
      - name: Validate embedded full-body MANA glTF asset
        working-directory: .
        run: |
          for model in launcher/app/src/main/assets/mana_avatar_genesis*.gltf; do
            python3 tools/validate_mana_gltf.py "$model"
          done
      - name: Compile launcher and LiteRT-LM prototype
        working-directory: launcher
        run: gradle --no-daemon :system-binder:assembleDebug :app:assembleDebug :app:testDebugUnitTest

      - name: Publish Android companion APK
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-Android-Companion-APK
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
