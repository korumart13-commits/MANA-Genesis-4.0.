name: MANA Launcher — Gradle source verification

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/mana-launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/mana-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile launcher and LiteRT-LM prototype
        working-directory: launcher
        run: gradle --no-daemon :app:assembleDebug
