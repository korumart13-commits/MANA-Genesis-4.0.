name: MANA Launcher — Gradle source verification

on:
  push:
    paths:
      - 'launcher/**'
      - 'system/mana/**'
      - 'platform/**'
      - 'device/**'
      - 'tools/validate_rmx5566_profile.py'
      - 'engine/mana-brain/**'
      - 'os/core/**'
      - '.github/workflows/mana-launcher.yml'
      - '.github/workflows/mana-android-build.yml'
      - '.github/workflows/mana-emulator-smoke.yml'
      - 'tools/run_mana_emulator_smoke.sh'
      - 'tools/validate_mana_gltf.py'
      - 'tools/validate_mana_installer_contract.py'
      - 'tools/validate_mana_game_pack.py'
      - 'game/mana-xz-world/**'
      - 'game/minecraft-bedrock/**'
      - 'distribution/**'
      - 'tools/stage_mana_aosp_prebuilt.sh'
      - 'tools/test_stage_mana_aosp_prebuilt.sh'
      - 'tools/verify_mana_platform_signature.sh'
  pull_request:
    paths:
      - 'launcher/**'
      - 'system/mana/**'
      - 'platform/**'
      - 'device/**'
      - 'tools/validate_rmx5566_profile.py'
      - 'engine/mana-brain/**'
      - 'os/core/**'
      - '.github/workflows/mana-launcher.yml'
      - '.github/workflows/mana-emulator-smoke.yml'
      - 'tools/validate_mana_installer_contract.py'
      - 'tools/validate_mana_game_pack.py'
      - 'game/mana-xz-world/**'
      - 'game/minecraft-bedrock/**'
      - 'distribution/**'
      - '.github/workflows/mana-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-launcher-${{ github.ref }}
  cancel-in-progress: true


jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify canonical MANA Brain module is included
        working-directory: .
        run: |
          grep -F 'include(":app", ":core", ":brain")' launcher/settings.gradle.kts
          grep -F 'project(":brain").projectDir = file("../engine/mana-brain")' launcher/settings.gradle.kts
          grep -F 'implementation(project(":brain"))' launcher/app/build.gradle.kts
          test ! -e launcher/app/src/main/java/com/mana/brain/ManaBrain.kt
      - name: Validate MANA Engine service ownership boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          activity = Path("launcher/app/src/main/java/com/mana/launcher/MainActivity.kt").read_text()
          service = Path("launcher/app/src/main/java/com/mana/launcher/ManaEngineService.kt").read_text()
          bridge = Path("launcher/app/src/main/java/com/mana/launcher/ManaEngineBridgeService.kt").read_text()
          owner = Path("launcher/app/src/main/java/com/mana/launcher/ManaEngineProcessOwner.kt").read_text()
          catalog = Path("launcher/app/src/main/java/com/mana/launcher/ManaModelCatalog.kt").read_text()
          manifest = Path("launcher/app/src/main/AndroidManifest.xml").read_text()
          assert "ManaEngineProcessOwner.acquire(this, ManaAndroidKeyProvider())" in service
          assert "ManaEngineProcessOwner.release()" in service
          assert "IManaEngineBackend.Stub()" in bridge
          assert "ManaEngineProcessOwner.acquire(this, ManaAndroidKeyProvider())" in bridge
          assert "ManaEngineProcessOwner.release()" in bridge
          assert "checkCallingPermission(BIND_PERMISSION)" in bridge
          assert "allowPersonalMemoryToCloud = request.allowPersonalMemoryToCloud" in bridge
          assert 'android:permission="com.mana.permission.BIND_BRAIN"' in manifest
          assert 'android:name=".ManaEngineBridgeService"' in manifest
          assert "fun acquire(context: Context, keyProvider: ManaAndroidKeyProvider)" in owner
          assert "fun release()" in owner
          assert "if (serviceOwners == 0) shutdownResourcesLocked()" in owner
          assert "fun ensureSavedModelLoaded(" in owner
          assert "ManaEngineProcessOwner.ensureSavedModelLoaded(this)" in bridge
          assert "MANA-Model-Bootstrap" in owner
          assert "modelLoadCallbacks" in owner
          assert "Локальная модель ещё не установлена" in owner
          assert "pendingCallbacks.forEach" in owner
          assert "fun acknowledgeGemmaLicense()" in catalog
          assert "Выбрать Gemma из комплекта" in activity
          assert "catalog.acknowledgeGemmaLicense()" in activity
          assert "copied == ManaModelCatalog.MODEL_SIZE" in activity
          assert "initializeFromService(" not in activity
          assert "initializeDependenciesFromService(" not in activity
          assert "LocalModelRuntime(" not in activity
          assert "ManaBrainBridge(" not in activity
          assert "ManaMemoryService(" not in activity
          assert "binder.localModelRuntime()" in activity
          assert "binder.isInitialized()" in activity
          assert "binder.memoryService()" in activity
          assert "localRuntime.shutdown()" not in activity
          assert "engineBinder.think(" in activity
          assert "manaBrain.respond(" not in activity
          assert activity.count("override fun onResume()") == 1
          assert activity.count("override fun onPause()") == 1
          assert activity.count("override fun onDestroy()") == 1
          assert "ManaEngineReconnectController(this)" in activity
          assert "override fun onResume()" in activity
          assert "override fun onPause()" in activity
          assert "reconnectController?.cancel()" in activity
          assert "override fun onBindingDied(name: ComponentName?)" in activity
          assert "override fun onNullBinding(name: ComponentName?)" in activity
          assert "reconnectController?.onFailure()" in activity
          assert "reconnectController?.onConnected()" in activity
          assert "editor.apply()" in Path("launcher/app/src/main/java/com/mana/launcher/ManaEngineReconnectController.kt").read_text()
          assert "val brainBridge = ManaBrainBridge(local, listOf(cloudGateway, yandexProvider))" in owner
          assert "ManaMemoryService(" in owner
          assert "MANA Engine dependencies are already prepared" in owner
          assert "fun isPrepared(): Boolean = synchronized(lock)" in owner
          print("Validated service-owned Brain, inference and encrypted memory creation plus Binder-only Activity access.")
          PY
      - name: Validate platform MANA Brain Binder contract
        run: |
          test -f system/mana/interfaces/Android.bp
          grep -F 'name: "mana-brain-interface"' system/mana/interfaces/Android.bp
          grep -F 'void think(in ManaBrainRequest request, IManaBrainCallback callback);' system/mana/interfaces/src/com/mana/brain/IManaBrain.aidl
          grep -F 'interface IManaEngineBackend {' system/mana/interfaces/src/com/mana/brain/IManaEngineBackend.aidl
          grep -F 'void think(in ManaBrainRequest request, IManaEngineBackendCallback callback);' system/mana/interfaces/src/com/mana/brain/IManaEngineBackend.aidl
          grep -F 'String memoryQuery;' system/mana/interfaces/src/com/mana/brain/ManaBrainRequest.aidl
          grep -F 'aidl = true' launcher/app/build.gradle.kts
          grep -F 'aidl.srcDir("../../system/mana/interfaces/src")' launcher/app/build.gradle.kts
          grep -F 'boolean allowCloud = false;' system/mana/interfaces/src/com/mana/brain/ManaBrainRequest.aidl
          grep -F 'boolean sensitive = false;' system/mana/interfaces/src/com/mana/brain/ManaBrainRequest.aidl
          grep -F 'static_libs: ["mana-brain-interface"],' system/mana/apps/ManaAssistant/Android.bp
          grep -F 'ENGINE_UNAVAILABLE' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
      - name: Validate pinned AOSP MANA local manifest
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          root = ET.parse("platform/local_manifests/mana.xml").getroot()
          project = root.find("project")
          assert project is not None
          assert project.attrib["name"] == "korumart13-commits/MANA-Genesis-4.0."
          assert project.attrib["path"] == "vendor/mana/genesis"
          assert re.fullmatch(r"[0-9a-f]{40}", project.attrib["revision"])
          assert root.find("remote").attrib["fetch"] == "https://github.com/"
          print("Validated immutable MANA source snapshot in AOSP local manifest.")
          PY
      - name: Validate owner-confirmed RMX5566 device profile and safe Termux collector
        run: |
          python3 tools/validate_rmx5566_profile.py
          bash -n device/collect_rmx5566_readonly_audit.sh
          ! grep -E '(^|[[:space:]])(su|fastboot|dd|flash|reboot|wipe|setprop|mount)([[:space:]]|$)' device/collect_rmx5566_readonly_audit.sh
          grep -F 'ro.boot.verifiedbootstate' device/collect_rmx5566_readonly_audit.sh
          grep -F 'ro.boot.vbmeta.device_state' device/collect_rmx5566_readonly_audit.sh
          grep -F '07_selinux_state.txt' device/collect_rmx5566_readonly_audit.sh
          grep -F '08_vintf_availability.txt' device/collect_rmx5566_readonly_audit.sh
          grep -F 'vendor/etc/vintf' device/collect_rmx5566_readonly_audit.sh
      - name: Execute MANA Brain request policy host tests
        run: |
          mkdir -p /tmp/mana-brain-policy-test
          javac -d /tmp/mana-brain-policy-test \
            system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainRequestPolicy.java \
            system/mana/services/ManaBrainService/tests/host/ManaBrainRequestPolicyHostTest.java
          java -cp /tmp/mana-brain-policy-test com.mana.system.brain.ManaBrainRequestPolicyHostTest
      - name: Validate platform MANA Brain service boundary
        run: |
          test -f system/mana/services/ManaBrainService/Android.bp
          test -f system/mana/services/ManaBrainService/AndroidManifest.xml
          grep -F 'ManaLauncher' system/mana/mana_product.mk
          grep -F 'ManaBrainService' system/mana/mana_product.mk
          ! grep -F 'ManaAssistant' system/mana/mana_product.mk
          grep -F 'certificate: "platform"' system/mana/services/ManaBrainService/Android.bp
          grep -F 'privileged: false' system/mana/services/ManaBrainService/Android.bp
          ! grep -F 'privileged: true' system/mana/services/ManaBrainService/Android.bp
          grep -F 'privileged: false' system/mana/services/ManaBrainService/Android.bp
          ! grep -F 'privileged: true' system/mana/services/ManaBrainService/Android.bp
          grep -F 'android:protectionLevel="signature"' system/mana/services/ManaBrainService/AndroidManifest.xml
          grep -F 'android:permission="com.mana.permission.BIND_BRAIN"' system/mana/services/ManaBrainService/AndroidManifest.xml
          grep -F 'checkCallingPermission(BIND_PERMISSION)' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'STATE_DISCONNECTED = "UNAVAILABLE_ENGINE_BACKEND_DISCONNECTED"' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'IManaEngineBackend.Stub.asInterface(service)' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'current.think(request' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'com.mana.launcher.ManaEngineBridgeService' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'ManaBrainRequestPolicy.validate(' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'sensitive && allowCloud' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainRequestPolicy.java
          grep -F 'allowPersonalMemoryToCloud && (!allowCloud || !includePersonalMemory)' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainRequestPolicy.java
          grep -F 'MAX_PROMPT_CHARS = 32_768' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainRequestPolicy.java
          grep -F 'isSupportedProvider(preferredCloudProvider)' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainRequestPolicy.java
          grep -F 'request.preferredCloudProvider' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'rejectsOversizedPrompt' system/mana/services/ManaBrainService/tests/src/com/mana/system/brain/ManaBrainRequestPolicyTest.java
          grep -F 'java_test_host' system/mana/services/ManaBrainService/Android.bp
          grep -F 'acceptsMemoryExportOnlyWithBothConsents' system/mana/services/ManaBrainService/tests/src/com/mana/system/brain/ManaBrainRequestPolicyTest.java
          grep -F 'boolean allowPersonalMemoryToCloud = false;' system/mana/interfaces/src/com/mana/brain/ManaBrainRequest.aidl
          grep -F 'ENGINE_UNAVAILABLE' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'new ThreadPoolExecutor(' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'new ArrayBlockingQueue<>(MAX_PENDING_REQUESTS)' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'catch (RejectedExecutionException overloaded)' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'MAX_PENDING_REQUESTS = 32' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'requests.execute' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
          grep -F 'requests.shutdownNow()' system/mana/services/ManaBrainService/src/com/mana/system/brain/ManaBrainService.java
      - name: Validate AOSP prebuilt staging workflow
        run: |
          bash tools/test_stage_mana_aosp_prebuilt.sh
          grep -F 'certificate: "platform"' tools/stage_mana_aosp_prebuilt.sh
          grep -F 'privileged: false' tools/stage_mana_aosp_prebuilt.sh
      - name: Validate embedded full-body MANA glTF asset
        working-directory: .
        run: |
          for model in launcher/app/src/main/assets/mana_avatar_genesis*.gltf; do
            python3 tools/validate_mana_gltf.py "$model"
          done
      - name: Validate MANA XZ game companion package
        run: python3 tools/validate_mana_game_pack.py
      - name: Package standalone MANA XZ game source
        run: |
          mkdir -p release
          zip -qr release/MANA-XZ-GAME-PACK.zip game/mana-xz-world
          sha256sum release/MANA-XZ-GAME-PACK.zip > release/MANA-XZ-GAME-PACK.zip.sha256
      - name: Upload standalone MANA XZ game source
        uses: actions/upload-artifact@v4
        with:
          name: MANA-XZ-GAME-PACK
          path: |
            release/MANA-XZ-GAME-PACK.zip
            release/MANA-XZ-GAME-PACK.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Test canonical MANA Brain and OS core
        working-directory: launcher
        run: gradle --no-daemon :brain:test :core:test
      - name: Validate Minecraft Bedrock companion pack
        run: |
          node --check game/minecraft-bedrock/MANA_Companion_BP/scripts/main.js
          node --check game/minecraft-bedrock/scripts/mana_bridge.js
          python3 -c 'import json; json.load(open("game/minecraft-bedrock/MANA_Companion_BP/manifest.json", encoding="utf-8"))'
      - name: Validate one-button installer contract for realme C85 4G
        run: python3 tools/validate_mana_installer_contract.py
      - name: Compile Android launcher and test app
        working-directory: launcher
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Build unsigned release APK for AOSP platform signing
        working-directory: launcher
        run: |
          gradle --no-daemon :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          test -n "$APKANALYZER"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$DEBUG_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK"
          for CANDIDATE in "$APK" "$DEBUG_APK"; do
            test "$("$APKANALYZER" manifest application-id "$CANDIDATE")" = "com.mana.launcher"
            MANIFEST="$("$APKANALYZER" manifest print "$CANDIDATE")"
            grep -q 'ManaEngineBridgeService' <<< "$MANIFEST"
            grep -q 'com.mana.permission.BIND_BRAIN' <<< "$MANIFEST"
            if grep -E 'android.permission.(CALL_PHONE|READ_CALL_LOG)|android.intent.action.(DIAL|CALL)|ManaDialerActivity|ManaInCallService|ManaCallScreeningService|ManaCallActionReceiver|ROLE_DIALER|ROLE_CALL_SCREENING' <<< "$MANIFEST"; then
              echo "Forbidden built-in dialer/call handling declaration found in $CANDIDATE" >&2
              exit 1
            fi
          done
          sha256sum "$APK" > app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Assemble complete Omega folder and verify official Gemma 4 E2B LiteRT-LM weights
        timeout-minutes: 60
        run: |
          set -euo pipefail
          mkdir -p release/offline
          PACKAGE="release/offline/Ω"
          mkdir -p "$PACKAGE"
          cp -a "distribution/Ω/." "$PACKAGE/"
          mkdir -p "$PACKAGE/installer" "$PACKAGE/models/Gemma" "$PACKAGE/source" "$PACKAGE/docs" "$PACKAGE/app" "$PACKAGE/avatar/characters" "$PACKAGE/engine" "$PACKAGE/game" "$PACKAGE/firmware/system" "$PACKAGE/firmware/device"
          cp launcher/app/build/outputs/apk/debug/app-debug.apk "$PACKAGE/app/MANA-Omega-debug.apk"
          cp -a launcher/app/build/generated/manaVoiceAssets/mana_voice/. "$PACKAGE/voice/ru/"
          cp launcher/app/src/main/assets/mana_avatar_genesis*.gltf "$PACKAGE/avatar/characters/"
          cp -a engine/mana-brain "$PACKAGE/engine/"
          cp -a os/core "$PACKAGE/engine/os-core/"
          cp -a os/native/llama-jni "$PACKAGE/engine/native-llama-jni/"
          cp -a game/mana-xz-world "$PACKAGE/game/"
          cp -a game/minecraft-bedrock "$PACKAGE/game/"
          cp -a platform "$PACKAGE/firmware/"
          cp -a system/mana "$PACKAGE/firmware/system/"
          cp -a device/RMX5566RU "$PACKAGE/firmware/device/"
          cp docs/MANA_XZ_MOBILE_UX_RESEARCH_AND_DESIGN_RU.md "$PACKAGE/docs/"
          cp docs/MANA_GENESIS_4_0_COMPLETE_USER_VISION_RU.md "$PACKAGE/docs/"
          cp docs/MANA_GENESIS_4_0_NON_NEGOTIABLE_REQUIREMENTS_AND_GAPS.md "$PACKAGE/docs/"
          cp os/FULL_ROM_RELEASE_TARGET.md "$PACKAGE/docs/"
          cp device/RMX5566RU_TARGET_PROFILE.md "$PACKAGE/docs/"
          MODEL="release/offline/Gemma4-E2B.litertlm"
          URL="https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/21c646194210256750db12cfa1e4fdf22bd3ddf1/gemma-4-E2B-it.litertlm"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 3600 "$URL" --output "$MODEL"
          echo "181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c  $MODEL" | sha256sum --check -
          cp "$MODEL" "$PACKAGE/models/Gemma/gemma-4-E2B-it.litertlm"
          test "$(stat -c '%s' "$PACKAGE/models/Gemma/gemma-4-E2B-it.litertlm")" = "2588147712"
          curl --fail --location --retry 5 --connect-timeout 30 --max-time 120 https://www.apache.org/licenses/LICENSE-2.0.txt --output "$PACKAGE/models/Gemma/LICENSE-APACHE-2.0.txt"
          cat > "$PACKAGE/models/Gemma/NOTICE.txt" <<'NOTICE'
          Gemma 4 E2B instruction-tuned model weights by Google DeepMind.
          LiteRT-LM package published by litert-community.
          Licensed under the Apache License, Version 2.0; see LICENSE-APACHE-2.0.txt.
          This distribution is not endorsed by Google.
          NOTICE
          test "$(stat -c '%s' "$MODEL")" -gt 2500000000
          test "$(stat -c '%s' "$MODEL")" -lt 3000000000
          cp launcher/app/build/outputs/apk/debug/app-debug.apk "$PACKAGE/installer/INSTALL_MANA_XZ.apk"
          cat > "$PACKAGE/models/Gemma/MODEL_MANIFEST_RU.txt" <<'EOF'
          Локальная модель MANA Genesis 4.0
          Имя файла: gemma-4-E2B-it.litertlm
          Размер: 2 588 147 712 байт (около 2,59 ГБ)
          SHA-256: 181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c
          Источник: https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm
          Закреплённый файл: https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/21c646194210256750db12cfa1e4fdf22bd3ddf1/gemma-4-E2B-it.litertlm
          Лицензия модели Gemma 4: Apache License 2.0; копия лицензии находится в LICENSE-APACHE-2.0.txt.
          Полный файл модели включён в models/Gemma/gemma-4-E2B-it.litertlm внутри этого ZIP.
          После явного согласия владелец выбирает этот файл в системном Android-пикере; MANA копирует его в закрытое хранилище, проверяет размер и SHA-256, затем подключает.
          Альтернативно MANA может загрузить ту же закреплённую версию через Android Download Manager по Wi-Fi.
          EOF
          git archive --format=zip --output="$PACKAGE/source/MANA-XZ-source-project.zip" HEAD
          cp launcher/LOCAL_MODEL_SETUP.md "$PACKAGE/docs/LOCAL_MODEL_SETUP_RU.md"
          cp docs/MANA_GENESIS_4_0_NON_NEGOTIABLE_REQUIREMENTS_AND_GAPS.md "$PACKAGE/docs/MASTER_REQUIREMENTS_RU.md"
          cat > "$PACKAGE/README-FIRST-RU.txt" <<'EOF'
          MANA XZ — Ω / MANA Genesis 4.0 — полный Android-комплект для realme C85 4G / RMX5566

          1. Полностью распакуй архив. В корне находится папка Ω.
          2. Установи installer/INSTALL_MANA_XZ.apk и подтверди стандартный запрос Android.
          3. Запусти MANA. В мастере локальной модели выбери models/Gemma/gemma-4-E2B-it.litertlm.
          4. Дождись копирования в приватное хранилище и полной проверки SHA-256.
          5. После импорта локальный Gemma runtime работает без интернета; интернет нужен для исследований и включённых облачных сервисов.

          ВАЖНО:
          - LiteRT-LM runtime и Piper Irina offline voice входят в APK; файл Gemma (2,588,147,712 байт) находится отдельно в models/Gemma.
          - Рекомендуется около 8 ГБ свободного места для распаковки и импорта модели.
          - MANA проверяет доступную физическую RAM. Динамическое расширение памяти не считается физической RAM.
          - APK — debug-подписанный Android-прототип, не прошивка. Папку firmware/ нельзя прошивать или копировать в системный раздел.
          - MANA Wallpaper генерирует статические изображения только для экрана блокировки; анимированный live wallpaper пока не подтверждён.
          - Smart Receptionist пока содержит локальную политику/настройки; реальное автоответное обслуживание звонков не подключено.
          - Minecraft .mcpack — отдельный Bedrock прототип; Android-мост к MANA Brain ещё не реализован.
          - Фоновые задачи Android не гарантируют непрерывную работу 24/7.
          - Реальный запуск и производительность на физическом RMX5566 ещё требуют проверки.
          EOF
          cat > "$PACKAGE/INSTALL_REPORT_TEMPLATE.txt" <<'EOF'
          MANA Genesis 4.0 — отчёт установки
          Устройство: realme C85 4G / RMX5566
          Дата установки: __________________
          Версия Android / API: __________________
          Свободное место до загрузки: __________________
          Установка APK: НЕ ПРОВЕРЕНО
          Согласие с условиями Gemma: НЕ ПРОВЕРЕНО
          Загрузка Gemma: НЕ ПРОВЕРЕНО
          SHA-256 Gemma: НЕ ПРОВЕРЕНО
          Запуск LiteRT-LM: НЕ ПРОВЕРЕНО
          Локальная генерация без интернета: НЕ ПРОВЕРЕНО
          Примечания / ошибки: __________________
          EOF
          node --check game/minecraft-bedrock/MANA_Companion_BP/scripts/main.js
          node --check game/minecraft-bedrock/scripts/mana_bridge.js
          python3 -c 'import json; json.load(open("game/minecraft-bedrock/MANA_Companion_BP/manifest.json", encoding="utf-8"))'
          (cd game/minecraft-bedrock/MANA_Companion_BP && zip -qr "$GITHUB_WORKSPACE/$PACKAGE/game/MANA_Companion_BP.mcpack" manifest.json scripts)
          cat > "$PACKAGE/README_RU.md" <<'EOF'
          # MANA XZ — Ω (OMEGA FINAL)

          Это полный Android-комплект MANA XZ / MANA Genesis 4.0.

          ## Что находится в папке
          - app/MANA-Omega-debug.apk и installer/INSTALL_MANA_XZ.apk — один и тот же устанавливаемый debug APK.
          - LiteRT-LM Android runtime, sherpa-onnx Piper runtime и Filament/SceneView входят в APK.
          - models/Gemma/gemma-4-E2B-it.litertlm — локальные веса Gemma 4 E2B IT (2,588,147,712 байт); импортируются один раз через Android file picker.
          - voice/ru/ — ресурсы Piper Irina; те же ресурсы упакованы в APK.
          - avatar/characters/ — glTF-модели постоянного 3D-аватара МАНЫ; они также находятся в APK.
          - engine/ — исходники MANA Brain, OS Core и экспериментальной llama.cpp ветки.
          - game/ — Godot world source, Minecraft Bedrock source и MANA_Companion_BP.mcpack.
          - firmware/ — AOSP local manifest, MANA system modules и RMX5566RU профиль для будущей ROM-интеграции.
          - design/ и config/ — визуальная система, настройки и статусы всех модулей.
          - source/MANA-XZ-source-project.zip — полный исходный проект на commit этого CI запуска.

          ## Установка
          1. Распакуй архив на телефоне; желательно иметь около 8 ГБ свободного места.
          2. Установи installer/INSTALL_MANA_XZ.apk.
          3. Запусти MANA и выбери models/Gemma/gemma-4-E2B-it.litertlm в системном Android file picker.
          4. MANA проверит размер и SHA-256 и импортирует модель в приватное хранилище.
          5. После успешного импорта основной диалог работает локально. Голос Piper и 3D-аватар уже находятся в APK.

          ## Реальные ограничения
          - APK — debug-прототип приложения, не системная прошивка.
          - Полноценный AOSP ROM не собран. Firmware tree — исходники/план, не flashable image.
          - Реальная обработка телефонных вызовов секретарём, Android–Minecraft bridge, Google services OAuth, wearable/car adapters, Shogun/Hydra/Microworld и Adaptive System Merge не выдаются за готовые функции; их состояния перечислены в config/modules.json.
          - Wallpaper сейчас автоматически создаёт статические изображения только для lock screen с интервалами 15/30/60/180 минут; Android может задерживать WorkManager.
          - Фоновые исследования работают в рамках ограничений Android; гарантий непрерывной работы 24/7 нет.
          - MANA Resource Governor использует ориентир 3,548 MB доступной физической RAM для этой модели. Это консервативная внутренняя оценка, не официальное требование Gemma; тест на реальном RMX5566 обязателен.
          - 16 GB динамического расширения памяти не считается физической RAM.

          Не прошивать содержимое firmware/ и не копировать его в системные разделы Android.
          EOF
          APK_SHA256="$(sha256sum "$PACKAGE/app/MANA-Omega-debug.apk" | awk '{print $1}')"
          MODEL_SHA256="$(sha256sum "$PACKAGE/models/Gemma/gemma-4-E2B-it.litertlm" | awk '{print $1}')"
          cat > "$PACKAGE/BUILD_REPORT_RU.txt" <<EOF
          MANA XZ — Ω build report
          Branch: $GITHUB_REF_NAME
          Commit: $GITHUB_SHA
          GitHub Actions run: $GITHUB_RUN_ID
          APK: app/MANA-Omega-debug.apk
          APK SHA-256: $APK_SHA256
          Gemma file: models/Gemma/gemma-4-E2B-it.litertlm
          Gemma SHA-256: $MODEL_SHA256
          Piper archive SHA-256 pinned by Gradle: 1fc0f54e5e084fe287c07909f2f6e0ba6d857864cf800e3ab80286a4e8233008
          Checks completed before packaging: MANA Brain tests, OS Core tests, Android app unit tests, debug APK build, unsigned release build, Gemma file size/SHA-256 verification, Piper archive SHA-256 verification, source/package contract validation.
          Physical RMX5566 test: NOT PERFORMED by this CI run.
          Full AOSP ROM / flashable image: NOT BUILT.
          APK type: debug-signed installable Android prototype; not a firmware image.
          EOF
          (cd "$PACKAGE" && find . -type f ! -path './SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd "$PACKAGE" && sha256sum --check SHA256SUMS.txt)
          (cd release/offline && zip -0 -q -r ../MANA-Omega-FULL-INSTALLER.zip Ω/)
          sha256sum release/MANA-Omega-FULL-INSTALLER.zip > release/MANA-Omega-FULL-INSTALLER.zip.sha256

      - name: Upload one-button MANA installer and source bundle
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Omega-FULL-INSTALLER
          path: |
            release/MANA-Omega-FULL-INSTALLER.zip
            release/MANA-Omega-FULL-INSTALLER.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Package complete tracked MANA source tree
        run: |
          mkdir -p release
          git archive --format=zip --output=release/MANA-XZ-source.zip HEAD
          sha256sum release/MANA-XZ-source.zip > release/SHA256SUMS.txt
          cat > release/BUILD_SCOPE.txt <<'EOF'
          MANA Genesis 4.0 — source bundle
          This archive contains the tracked source project at the workflow commit.
          The Android debug APK, if produced, is a launcher/application prototype only.
          This archive is NOT a complete AOSP checkout, device ROM, OTA package or flashable image.
          Target: RMX5566RU / RE645F / Qualcomm SM6225 / Android 16.
          Device-specific kernel, device tree, vendor blobs, VINTF, AVB signing,
          recovery and stock-restore validation remain release blockers.
          EOF
      - name: Upload source project bundle
        uses: actions/upload-artifact@v4
        with:
          name: MANA-XZ-source-project
          path: |
            release/MANA-XZ-source.zip
            release/SHA256SUMS.txt
            release/BUILD_SCOPE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned release APK for AOSP platform signing
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Android-release-unsigned-for-AOSP-platform-signing
          path: |
            launcher/app/build/outputs/apk/release/app-release-unsigned.apk
            launcher/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android debug prototype separately
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Android-debug-prototype-NOT-ROM
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

