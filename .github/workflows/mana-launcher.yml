name: MANA Launcher — Gradle source verification

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/mana-launcher.yml'
      - 'tools/validate_mana_gltf.py'
  pull_request:
    paths:
      - 'launcher/**'
      - '.github/workflows/mana-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android Brain mirror matches tested engine source
        working-directory: .
        run: diff -u engine/mana-brain/src/main/kotlin/com/mana/brain/ManaBrain.kt launcher/app/src/main/java/com/mana/brain/ManaBrain.kt
      - name: Validate embedded full-body MANA glTF asset
        working-directory: .
        run: |
          for model in launcher/app/src/main/assets/mana_avatar_genesis*.gltf; do
            python3 tools/validate_mana_gltf.py "$model"
          done
      - name: Compile launcher and LiteRT-LM prototype
        working-directory: launcher
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
