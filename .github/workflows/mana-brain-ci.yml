name: MANA Brain CI

on:
  push:
    paths:
      - "engine/mana-brain/**"
      - ".github/workflows/mana-brain-ci.yml"
  pull_request:
    paths:
      - "engine/mana-brain/**"
      - ".github/workflows/mana-brain-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mana-brain-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test MANA Brain (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run MANA Brain tests
        run: gradle --no-daemon -p engine/mana-brain clean test
