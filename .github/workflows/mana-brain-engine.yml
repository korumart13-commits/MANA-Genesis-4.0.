name: MANA Brain Engine — JVM verification

on:
  push:
    paths:
      - 'engine/mana-brain/**'
      - '.github/workflows/mana-brain-engine.yml'
  pull_request:
    paths:
      - 'engine/mana-brain/**'
      - '.github/workflows/mana-brain-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run MANA Brain tests
        run: gradle -p engine/mana-brain --no-daemon test
