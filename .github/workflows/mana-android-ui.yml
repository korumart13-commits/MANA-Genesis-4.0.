name: MANA Android UI — source verification

on:
  push:
    paths:
      - 'system/mana/apps/**'
      - 'system/mana/mana_product.mk'
      - 'engine/mana-brain/Android.bp'
      - 'system/mana/brain/**'
      - 'launcher/app/src/main/AndroidManifest.xml'
      - 'launcher/app/src/main/java/com/mana/launcher/ManaLocalInferenceService.kt'
      - '.github/workflows/mana-android-ui.yml'
  pull_request:
    paths:
      - 'system/mana/apps/**'
      - 'system/mana/mana_product.mk'
      - '.github/workflows/mana-android-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
      - name: Compile MANA UI Java sources against Android 16 API
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mana-ui-classes"
          javac -source 17 -target 17 \
            -classpath "$ANDROID_HOME/platforms/android-36/android.jar" \
            -d "$RUNNER_TEMP/mana-ui-classes" \
            $(find system/mana/apps -name '*.java' ! -name 'ManaBrainBinderService.java' ! -name 'ManaBrainBinderTest.java' ! -name 'ManaLauncherBrainIntegrationTest.java' ! -name 'ManaHomeActivity.java' ! -name 'ManaAndroidCapabilityExecutor.java' -print)
      - name: Validate MANA product package integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          product = Path('system/mana/mana_product.mk').read_text()
          expected = ['ManaLauncher', 'ManaAssistant', 'ManaSettings', 'ManaControlCenter']
          missing = [name for name in expected if name not in product]
          assert not missing, f'Missing MANA product packages: {missing}'
          print('All four non-privileged MANA apps are declared in the product package list.')
          PY
      - name: Validate manifests and permission surface
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          android_ns = "{http://schemas.android.com/apk/res/android}"
          manifests = list(pathlib.Path("system/mana/apps").glob("*/AndroidManifest.xml"))
          assert len(manifests) == 4, f"Expected 4 app manifests, found {len(manifests)}"
          for path in manifests:
              root = ET.parse(path).getroot()
              permissions = [node.attrib.get(android_ns + "name", "") for node in root.findall("uses-permission")]
              allowed = {"com.mana.permission.BIND_BRAIN"}
              unexpected = sorted(set(permissions) - allowed)
              assert not unexpected, f"{path} unexpectedly requests permissions: {unexpected}"
              bp = path.parent / "Android.bp"
              build = bp.read_text()
              assert 'privileged: false' in build, f"{bp} must remain non-privileged"
              assert 'certificate: "default"' in build, f"{bp} must not use platform signing"
              for activity in root.findall("./application/activity"):
                  assert activity.attrib.get(android_ns + "exported") == "true", f"{path}: activity exported must be explicit"
          print("Validated 4 manifests: no runtime permissions requested; exported activities are explicit.")
          PY
