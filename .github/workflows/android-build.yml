name: MANA Genesis 4.0 — Android 16 build
on:
  workflow_dispatch:
  push:
    paths:
      - 'MANA_Genesis_4_0_MIRROR_READY_SOURCE*.zip'
      - '.github/workflows/android-build.yml'
permissions:
  contents: read
concurrency:
  group: mana-genesis-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source bundle
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -type f -name 'MANA_Genesis_4_0_MIRROR_READY_SOURCE*.zip' -print -quit)"
          test -n "$ARCHIVE"
          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE" -d source
          echo "PROJECT_DIR=source/MANA_Genesis_4_0_COMPLETE/MANA_Genesis_4.0_Unified/existing_aosp/MANA_OS_3_0_Android_Project" >> "$GITHUB_ENV"
      - name: Repair broken multiline Kotlin welcome string
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/mana/os/app/MainActivity.kt"
          s = p.read_text(encoding="utf-8")
          broken = 'base("MANA", "Первоначальная настройка\nЯ стану твоим главным интерфейсом, сохраняя Android в качестве системной основы.")'
          fixed = 'base("MANA", "Первоначальная настройка\\nЯ стану твоим главным интерфейсом, сохраняя Android в качестве системной основы.")'
          if broken in s:
              s = s.replace(broken, fixed, 1)
              p.write_text(s, encoding="utf-8")
              print("Fixed MainActivity.kt welcome string")
          elif fixed in s:
              print("Welcome string already fixed")
          else:
              raise SystemExit("Expected welcome string not found; refusing an unsafe patch")
          PY
      - name: Validate Android project and wrapper
        run: |
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/gradlew"
          test -s "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
      - name: Build and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-cloud.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-build-log
          path: build-cloud.log
          if-no-files-found: ignore
          retention-days: 14
