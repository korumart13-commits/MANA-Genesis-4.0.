name: MANA Genesis 4.0 — Android 16 build
on:
  workflow_dispatch:
  push:
    paths:
      - 'MANA_Genesis_4_0_MIRROR_READY_SOURCE.zip'
      - '.github/workflows/android-build.yml'
permissions:
  contents: read
concurrency:
  group: mana-genesis-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source bundle
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s MANA_Genesis_4_0_MIRROR_READY_SOURCE.zip
          unzip -q MANA_Genesis_4_0_MIRROR_READY_SOURCE.zip -d source
          echo "PROJECT_DIR=source/MANA_Genesis_4_0_COMPLETE/MANA_Genesis_4.0_Unified/existing_aosp/MANA_OS_3_0_Android_Project" >> "$GITHUB_ENV"
      - name: Validate Android project and wrapper
        run: |
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/gradlew"
          test -s "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
      - name: Build and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-cloud.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MANA-Genesis-4.0-build-log
          path: build-cloud.log
          if-no-files-found: ignore
          retention-days: 14
